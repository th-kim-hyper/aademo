<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap 5 레이아웃</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/assets/css/global.css" rel="stylesheet" />
    <script type="module" src="/assets/js/global.js"></script>
  </head>
  <body>
    <div class="layout-container">
      <!-- 고정 헤더 -->
      <templated-element template-id="header-template">
        <div slot="logo">
          <img
            src="/assets/images/hyper-logo.png"
            alt="하이퍼정보"
            class="logo-image"
          />
        </div>
      </templated-element>

      <!-- 메인 래퍼 (사이드바 + 컨텐츠) -->
      <div class="main-wrapper">
        <!-- 사이드바 -->
        <templated-element template-id="sidebar-template"></templated-element>

        <!-- 메인 컨텐츠 -->
        <templated-element template-id="main-template"></templated-element>
      </div>

      <!-- 고정 푸터 -->
      <templated-element template-id="footer-template"></templated-element> 
      <!-- <footer-element></footer-element> -->
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    <script>
      // 사이드바 메뉴 활성화
      document.querySelectorAll(".sidebar-nav a").forEach((link) => {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          document
            .querySelectorAll(".sidebar-nav a")
            .forEach((a) => a.classList.remove("active"));
          this.classList.add("active");
        });
      });
    </script>
  </body>
</html>
